name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run on the same ref has no value; cancelling it keeps the queue
# meaningful and stops a stale run from reporting on newer code.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # proxy.golang.org resolves on GitHub runners; goproxy.cn is the fallback for
  # the project's own development environment (see ADR-003).
  GOPROXY: https://proxy.golang.org,https://goproxy.cn,direct
  GOLANGCI_LINT_VERSION: v2.13.2

jobs:
  backend:
    name: Backend — format, vet, lint, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Read from go.mod rather than duplicated here, so the toolchain cannot
          # drift from the version the module declares.
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt
        working-directory: backend
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: backend
        run: go vet ./...

      # Cached because `go install` compiles the linter from source, which takes
      # a couple of minutes. Pinned to an exact version so a new release cannot
      # change the result of a previously green commit.
      - name: Restore golangci-lint
        id: golangci-lint-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}

      - name: Install golangci-lint
        if: steps.golangci-lint-cache.outputs.cache-hit != 'true'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}

      - name: golangci-lint
        working-directory: backend
        run: golangci-lint run ./...

      - name: build
        working-directory: backend
        run: go build ./...

      # -race is enabled because the worker and the reconciler are concurrent by
      # nature; a data race found after release is far more expensive.
      - name: unit tests
        working-directory: backend
        run: go test -count=1 -race ./...

  backend-integration:
    name: Backend — integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vps_billing
          POSTGRES_USER: vps_billing
          POSTGRES_PASSWORD: vps_billing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vps_billing -d vps_billing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DATABASE_URL: postgres://vps_billing:vps_billing@localhost:5432/vps_billing?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Proves the migration mechanism itself with a real database: it must
      # apply forward, be idempotent, and roll back.
      - name: Apply migrations
        working-directory: backend
        run: go run ./cmd/migrate up

      # Asserts through the migration binary itself rather than through psql, so
      # this step does not depend on a client being present on the runner.
      #
      # The version is read from stdout, which carries the command's *result*.
      # It must not be derived from a log record: at LOG_LEVEL=warn an INFO record
      # is suppressed, which is precisely how this assertion first failed.
      # Diagnostics go to stderr.
      - name: Assert the schema version was recorded
        working-directory: backend
        run: |
          # The expected version is derived from the migrations on disk rather than
          # written as a literal: a literal has to be updated by hand whenever a
          # phase adds a migration, and when it is forgotten the failure looks like
          # a migration defect instead of a stale assertion. The derivation lives in
          # one script because it previously appeared twice, and the second copy
          # compared "0003" against the "3" that golang-migrate reports.
          expected="$(bash ../scripts/expected-migration-version.sh migrations)"
          version="$(go run ./cmd/migrate version)"
          echo "reported schema version: '${version}' (highest migration on disk: ${expected})"
          if [ "${version}" != "${expected}" ]; then
            echo "::error::expected the schema to be at version ${expected}, got '${version}'"
            exit 1
          fi

      # The integration tier runs here and is skipped locally, where no database
      # is available (see ADR-003).
      #
      # Redis is part of it because the session store is where every authenticated
      # request reads its credential from. Its behaviour — a record surviving a
      # round trip, an expired one being refused, revocation reaching every
      # session of a subject — cannot be established against a fake, and a fake
      # plus a real store that disagree is worse than no test at all.
      #
      # `go test` prints no annotation on failure, and job logs require
      # authentication to download even for a public repository, so the output is
      # republished as annotations: the failing test names first, then the tail of
      # the run, where the messages are. Without this a red integration job is a
      # number and nothing else.
      - name: integration tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://vps_billing:vps_billing@localhost:5432/vps_billing?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6379/0
        run: |
          set +e
          go test -count=1 ./... 2>&1 | tee /tmp/integration.log
          status="${PIPESTATUS[0]}"
          if [ "${status}" -eq 0 ]; then
            exit 0
          fi

          # The failing test names, one annotation each, so the list of what broke
          # is at the top of the annotations rather than buried in the tail.
          grep -E '(^|\s)FAIL' /tmp/integration.log | tail -n 20 | while IFS= read -r line; do
            line="${line//'%'/'%25'}"
            echo "::error::${line}"
          done

          # Then the tail, as one annotation: every step may show at most ten, so
          # line-per-annotation would be truncated silently. Line breaks are
          # encoded as %0A, and % is escaped first so the escape cannot corrupt
          # the separator it is meant to produce.
          message="$(tail -n 40 /tmp/integration.log \
            | sed -e 's/%/%25/g' -e 's/\r//g' \
            | awk 'NR>1{printf "%%0A"} {printf "%s", $0}')"
          echo "::error::${message}"

          exit "${status}"

  frontend:
    name: Frontend — typecheck, lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly the locked tree, so an image or bundle can never
      # be produced from a different dependency set than the one reviewed.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  compose-validate:
    name: Compose — validate the foundation file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Rejects a malformed or non-interpolable file before anything tries to
      # start it. Defaults are exercised, so no .env is needed here.
      - name: Validate
        run: docker compose -f deploy/docker-compose.yml config -q

  # The Phase 0 Gate from TASKS.md: "一条 compose 命令启动基础环境".
  #
  # This job starts the real environment and asserts against it. It is the only
  # place the Gate can genuinely run, because the development machine has neither
  # Docker nor WSL (ADR-003). Nothing here is marked continue-on-error: a Gate
  # that can pass without the stack starting would be a false success.
  foundation-gate:
    name: Phase 0 Gate — compose up, probes, migrations
    runs-on: ubuntu-latest
    # Bounded deliberately. The default is 360 minutes, so a build that stalls
    # spends an hour of runner time before anyone notices. This is short enough to
    # contain that and long enough for a cold image build; the digest published
    # below reports where the time went, so the bound can be revised against
    # evidence instead of raised by guesswork.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the environment file
        run: |
          password="$(openssl rand -hex 16)"
          cat > .env <<EOF
          APP_ENV=development
          POSTGRES_PASSWORD=${password}
          DATABASE_URL=postgres://vps_billing:${password}@postgres:5432/vps_billing?sslmode=disable
          REDIS_URL=redis://redis:6379/0
          LOG_LEVEL=info
          LOG_FORMAT=json
          USER_WEB_ORIGIN=http://localhost:3000
          ADMIN_WEB_ORIGIN=http://localhost:3001
          EOF

      # Facts about the runtime, recorded before anything is pulled or built so
      # that a capacity or version problem is distinguishable from a build error.
      - name: Docker environment
        run: |
          docker version
          docker compose version
          df -h / | tail -1
          df -h /var/lib/docker 2>/dev/null | tail -1 || true

      # The single command the Gate is defined by.
      #
      # `--progress plain` keeps the output line-oriented, so it can be replayed as
      # annotations. Downloading this job's log requires authentication, while
      # annotations on a public repository are readable without a token; publishing
      # the failure detail as annotations is what makes a red Gate diagnosable
      # without a human copying the log out of a browser.
      - name: Start the foundation environment
        run: |
          set -o pipefail

          # Written before the command starts so the digest step can report elapsed
          # time even when this step is cancelled or times out before it can report
          # anything itself.
          date +%s > compose-start.epoch

          # `timeout` bounds the command itself, not merely the job. `up -d` waits
          # for its `depends_on` conditions, so a service that starts but never
          # satisfies one — a one-shot container that never exits, for instance —
          # blocks until something outside stops it. Failing after eight minutes
          # with a diagnosis is far cheaper than occupying the whole job budget and
          # then being cancelled with nothing to show for it.
          timeout --kill-after=30 480 \
            docker compose --env-file .env --progress plain \
              -f deploy/docker-compose.yml up -d --build 2>&1 | tee compose-up.log
          status="${PIPESTATUS[0]}"

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          if [ "$status" -eq 124 ]; then
            echo "::error::docker compose up did not finish within 480s: it was waiting for a container that never became ready or never exited"
          fi

          tail -n 20 compose-up.log | while IFS= read -r line; do
            # Strip carriage returns, then escape `%`: it opens an escape sequence
            # in the annotation payload and would corrupt the message.
            line="${line//$'\r'/}"
            line="${line//'%'/'%25'}"
            if [ -n "$line" ]; then
              echo "::error::${line:0:500}"
            fi
          done
          echo "::error::docker compose up failed; its last lines are annotated above"
          exit 1

      - name: Wait for the API to report live
        run: |
          compose="docker compose --env-file .env -f deploy/docker-compose.yml"

          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:8080/health/live; then
              echo "liveness probe passed on attempt ${attempt}"
              exit 0
            fi
            sleep 2
          done

          # Publish the reason as annotations, which are readable without a token,
          # rather than only into a log that requires authentication to download.
          $compose ps -a | while IFS= read -r line; do
            line="${line//$'\r'/}"; line="${line//'%'/'%25'}"
            if [ -n "$line" ]; then echo "::error::ps: ${line:0:400}"; fi
          done
          $compose logs --no-color server migrate worker 2>&1 | tail -n 25 | while IFS= read -r line; do
            line="${line//$'\r'/}"; line="${line//'%'/'%25'}"
            if [ -n "$line" ]; then echo "::error::log: ${line:0:400}"; fi
          done

          echo "::error::the API did not become live within 120s"
          exit 1

      - name: Assert readiness reports every dependency up
        run: |
          report="$(curl -fsS http://localhost:8080/health/ready)"
          echo "$report"
          echo "$report" | grep -q '"status":"up"' || {
            echo "::error::readiness did not report up"
            exit 1
          }
          # A readiness body that omits its checks would satisfy the assertion
          # above while proving nothing.
          echo "$report" | grep -q '"name":"postgres"' || {
            echo "::error::the postgres dependency check is missing from the report"
            exit 1
          }
          echo "$report" | grep -q '"name":"redis"' || {
            echo "::error::the redis dependency check is missing from the report"
            exit 1
          }

      - name: Assert the migration service succeeded
        run: |
          container="$(docker compose --env-file .env -f deploy/docker-compose.yml ps -aq migrate)"
          if [ -z "$container" ]; then
            echo "::error::the migrate service was not created"
            exit 1
          fi
          code="$(docker inspect --format '{{.State.ExitCode}}' "$container")"
          if [ "$code" != "0" ]; then
            echo "::error::the migrate service exited with code $code"
            docker compose --env-file .env -f deploy/docker-compose.yml logs --no-color migrate
            exit 1
          fi
          echo "migrate exited 0"

      # Reads the migration state from inside the container, where psql is
      # guaranteed to exist, using two single-quoted queries rather than one
      # nested-quoting construction.
      #
      # The expected version comes from the shared script for the same reason as in
      # the integration job: a literal goes stale, and a second copy of the
      # derivation drifts.
      - name: Assert the schema is migrated and clean
        run: |
          compose="docker compose --env-file .env -f deploy/docker-compose.yml"
          expected="$(bash scripts/expected-migration-version.sh backend/migrations)"
          version="$($compose exec -T postgres psql -tA -U vps_billing -d vps_billing -c 'SELECT version FROM schema_migrations;' | tr -d '\r')"
          dirty="$($compose exec -T postgres psql -tA -U vps_billing -d vps_billing -c 'SELECT dirty FROM schema_migrations;' | tr -d '\r')"
          echo "schema_migrations: version=${version} dirty=${dirty} (highest migration on disk: ${expected})"
          if [ "${version}" != "${expected}" ] || [ "${dirty}" != "f" ]; then
            echo "::error::unexpected migration state: version=${version} dirty=${dirty} expected=${expected}"
            exit 1
          fi

      # The migration state alone would be satisfied by migrations that create
      # nothing. This asserts that the identity objects of Phase 1 are actually
      # present in the running environment.
      # The Gate asserts the schema the migrations claim to have created, rather than
      # trusting that `migrate` exiting 0 means it did anything. Without this, a
      # migration containing only comments would pass.
      #
      # Each phase extends the list with the tables it owns. The counts are literals
      # on purpose here, unlike the schema version: a table that goes missing is the
      # thing being detected, so deriving the expectation from the same files under
      # test would defeat it.
      - name: Assert the schema and seed data exist
        run: |
          compose="docker compose --env-file .env -f deploy/docker-compose.yml"
          query="SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name IN ('users','admins','roles','permissions','admin_roles','role_permissions','audit_events');"
          tables="$($compose exec -T postgres psql -tA -U vps_billing -d vps_billing -c "$query" | tr -d '\r')"
          roles="$($compose exec -T postgres psql -tA -U vps_billing -d vps_billing -c 'SELECT count(*) FROM roles;' | tr -d '\r')"
          permissions="$($compose exec -T postgres psql -tA -U vps_billing -d vps_billing -c 'SELECT count(*) FROM permissions;' | tr -d '\r')"
          echo "identity tables=${tables} roles=${roles} permissions=${permissions}"
          if [ "${tables}" != "7" ] || [ "${roles}" != "5" ] || [ "${permissions}" != "29" ]; then
            echo "::error::expected 7 identity tables, 5 roles and 29 permissions (docs/15's 27 plus 0005's subscription keys); got ${tables}, ${roles}, ${permissions}"
            exit 1
          fi

          # A seeded role with no permissions is silently useless, so at least one
          # grant is asserted rather than merely counting rows.
          grants="$($compose exec -T postgres psql -tA -U vps_billing -d vps_billing -c 'SELECT count(*) FROM role_permissions;' | tr -d '\r')"
          echo "role_permissions=${grants}"
          if [ "${grants}" -lt "27" ]; then
            echo "::error::the seeded roles hold fewer grants than super_admin alone should have (${grants})"
            exit 1
          fi

          commerce_query="SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name IN ('node_groups','products','plans','orders','order_items','payments','wallets','ledger_transactions','ledger_entries','outbox_events','subscriptions','invoices','invoice_items');"
          commerce="$($compose exec -T postgres psql -tA -U vps_billing -d vps_billing -c "$commerce_query" | tr -d '\r')"
          echo "commerce tables=${commerce}"
          if [ "${commerce}" != "13" ]; then
            echo "::error::expected 13 commercial tables; got ${commerce}"
            exit 1
          fi

          # The constraints that carry the invariants are asserted by name, because a
          # table that exists without them looks identical in a table count and is
          # missing the thing the phase decided. `email = lower(email)` is what makes
          # the plain UNIQUE constraint on an address sufficient (ADR-004); the
          # ledger reference index is the structural half of the idempotency decision
          # (ADR-005), so if it silently failed to create, the Gate's own duplicate
          # delivery check would be the only thing left holding it.
          constraints="$($compose exec -T postgres psql -tA -U vps_billing -d vps_billing -c "SELECT count(*) FROM pg_constraint WHERE conname IN ('users_email_normalized','admins_email_normalized','ledger_entries_direction_known','ledger_entries_account_type_known','invoices_has_an_origin','orders_total_is_subtotal_less_discount');" | tr -d '\r')"
          echo "named constraints=${constraints}"
          if [ "${constraints}" != "6" ]; then
            echo "::error::expected 6 named constraints; got ${constraints}"
            exit 1
          fi

          index_count="$($compose exec -T postgres psql -tA -U vps_billing -d vps_billing -c "SELECT count(*) FROM pg_indexes WHERE schemaname = 'public' AND indexname IN ('ux_payments_gateway_external','ux_ledger_transactions_reference','ix_outbox_events_pending','ix_subscriptions_sweep','ux_invoices_open_renewal');" | tr -d '\r')"
          echo "named indexes=${index_count}"
          if [ "${index_count}" != "5" ]; then
            echo "::error::expected 5 named indexes; got ${index_count}"
            exit 1
          fi

      - name: Assert both web clients are served
        run: |
          for port in 3000 3001; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:${port}/")"
            if [ "$code" != "200" ]; then
              echo "::error::the client on port ${port} answered ${code}"
              docker compose --env-file .env -f deploy/docker-compose.yml logs --no-color
              exit 1
            fi
            echo "port ${port} answered 200"
          done

      # Runs on every exit path: success, failure, timeout and cancellation.
      #
      # A cancelled step never reaches its own error handling, and this job's log
      # requires authentication to download even though the repository is public.
      # Without this step a run stopped early leaves no readable evidence at all,
      # which is exactly what the Gate's third run produced: it was cancelled
      # after 25 minutes and every diagnostic step was skipped.
      #
      # The digest separates "slow" from "stuck". BuildKit's plain progress prints
      # the elapsed time of each step as `#N DONE <seconds>`, so ranking those
      # answers "where did the time go" without needing a container runtime, and
      # the trailing lines show whether the stack ever came up.
      - name: Publish the build digest
        if: always()
        run: |
          compose="docker compose --env-file .env -f deploy/docker-compose.yml"

          {
            echo "gate digest"
            if [ -f compose-start.epoch ]; then
              echo "elapsed: $(( $(date +%s) - $(cat compose-start.epoch) ))s"
            else
              echo "the compose step never started"
            fi

            if [ -f compose-up.log ]; then
              echo "slowest build steps:"
              grep -oE '#[0-9]+ DONE [0-9.]+s' compose-up.log | sort -k3 -rn | head -n 8
              echo "last lines of the compose output:"
              tail -n 12 compose-up.log
            else
              echo "compose-up.log was never written"
            fi

            echo "container state:"
            $compose ps -a 2>&1 | tail -n 12

            echo "service logs (tail):"
            $compose logs --no-color 2>&1 | tail -n 15
          } > digest.txt || true

          # Published as ONE annotation: GitHub exposes at most ten per step, so a
          # per-line scheme would silently drop most of the digest.
          #
          # `%` opens an escape sequence in a workflow command, so it is escaped
          # before the separators are inserted; encoding it afterwards would
          # double-encode them. A newline terminates the command itself, so line
          # breaks are carried as %0A, which GitHub turns back into real ones.
          message="$(sed -e 's/%/%25/g' -e 's/\r//g' digest.txt \
            | awk 'NR>1{printf "%%0A"} {printf "%s", $0}')"

          # Notice on a green run, error otherwise, so an informative digest does
          # not paint red marks over a passing job.
          #
          # Written as if/else rather than `[ … ] && level=notice`: a failing `&&`
          # list returns the test's own exit status, and this is the last statement
          # in the script, so the digest step would have failed on exactly the runs
          # it exists for.
          if [ "${{ job.status }}" = "success" ]; then
            level=notice
          else
            level=error
          fi
          printf '::%s::%s\n' "$level" "$message"

      - name: Tear down
        if: always()
        run: docker compose --env-file .env -f deploy/docker-compose.yml down -v --remove-orphans
