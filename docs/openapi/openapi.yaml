openapi: 3.1.0
info:
  title: VPS Billing Platform API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  # The probe endpoints sit at the root rather than under the product API. They are
  # consumed by the container healthcheck and by the deployment, not by a client, so they
  # override the document's server rather than being described as product paths.
  /health/live:
    servers:
      - url: /
    get:
      operationId: healthLive
      responses:
        "200": {description: Alive}
  /health/ready:
    servers:
      - url: /
    get:
      operationId: healthReady
      responses:
        "200": {description: Ready}
        "503": {description: Not ready}
  /auth/register:
    post:
      operationId: register
      summary: Create a user account
      description: |
        Does not sign the account in. The session is issued by /auth/login, so there is
        one place that issues credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegisterRequest"}
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [user]
                        properties:
                          user: {$ref: "#/components/schemas/User"}
        "409":
          description: The address is already registered
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "422":
          description: A field is invalid
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "429":
          description: Too many attempts from this address
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /auth/login:
    post:
      operationId: login
      summary: Sign in as a user
      description: |
        On success the session cookie is set and the CSRF token is returned in the body.
        The token cannot be read from the cookie, which is HttpOnly, so the body is the
        only way a client can obtain it.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginRequest"}
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie:
              description: The session cookie. HttpOnly, SameSite=Lax, Secure outside development.
              schema: {type: string}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/UserSession"}
        "401":
          description: |
            Invalid credentials. Returned identically for a wrong password and an unknown
            address, so the endpoint does not disclose whether an account exists.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "403":
          description: The account is suspended
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "429":
          description: Too many attempts from this address or against this account
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /auth/logout:
    post:
      operationId: logout
      summary: End the current user session
      description: Requires the X-CSRF-Token header of the session being ended.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204": {description: Signed out}
        "401":
          description: No session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "403":
          description: The CSRF token is missing or wrong
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: The authenticated user
      description: |
        Returns the CSRF token as well, which is how a reloaded page recovers it without a
        second endpoint.
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/UserSession"}
        "401":
          description: No session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /admin/auth/login:
    post:
      operationId: adminLogin
      summary: Sign in as an administrator
      description: |
        Issues an administrator session in its own cookie. The customer and administrator
        credential spaces are separate in cookie name, storage namespace and subject type,
        so a customer session cannot authenticate an administrative endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginRequest"}
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie:
              description: The administrator session cookie.
              schema: {type: string}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/AdminSession"}
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "403":
          description: The account is suspended
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "429":
          description: Too many attempts
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /admin/auth/logout:
    post:
      operationId: adminLogout
      summary: End the current administrator session
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204": {description: Signed out}
        "401":
          description: No session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "403":
          description: The CSRF token is missing or wrong
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /admin/auth/me:
    get:
      operationId: adminGetCurrent
      summary: The authenticated administrator, with effective permissions
      responses:
        "200":
          description: The current administrator
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/AdminSession"}
        "401":
          description: No administrator session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "403":
          description: The account is suspended
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /products:
    get:
      operationId: listProducts
      summary: The catalogue
      description: |
        Public: it is what a customer reads before they have an account. Only products
        and plans whose status is `active` are returned, so a draft is never offered.
      responses:
        "200":
          description: Products with their plans
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [products]
                        properties:
                          products:
                            type: array
                            items: {$ref: "#/components/schemas/Product"}
  /orders:
    get:
      operationId: listOrders
      summary: The signed-in customer's orders
      responses:
        "200":
          description: Orders, most recent first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [orders]
                        properties:
                          orders:
                            type: array
                            items: {$ref: "#/components/schemas/Order"}
        "401":
          description: No session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    post:
      operationId: createOrder
      summary: Place an order
      description: |
        Prices the order from the catalogue. The caller states which plan and how many;
        it cannot state a price, because the unit price is read from the plan here.
        An invoice is opened with the order, before any payment exists.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [plan_id, quantity]
                    properties:
                      plan_id: {type: string, format: uuid}
                      quantity: {type: integer, minimum: 1, maximum: 1000}
                discount_minor: {type: integer, minimum: 0, default: 0}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [order]
                        properties:
                          order: {$ref: "#/components/schemas/Order"}
        "401":
          description: No session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "403":
          description: The CSRF token is missing or wrong
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "422":
          description: A field is invalid, or a plan is not on sale
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /orders/{id}:
    get:
      operationId: getOrder
      summary: One of the signed-in customer's orders
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [order]
                        properties:
                          order: {$ref: "#/components/schemas/Order"}
        "404":
          description: |
            No such order. The same answer whether it does not exist or belongs to
            somebody else, so one customer's identifiers cannot enumerate another's.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /orders/{id}/payments:
    post:
      operationId: startPayment
      summary: Ask a gateway to take the order's money
      description: |
        Returns the gateway's own payment identifier and the URL the customer completes
        the payment at. The idempotency key is derived from the order and the gateway, so
        a retry cannot create a second payment for the same order.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gateway]
              properties:
                gateway: {type: string}
      responses:
        "201":
          description: The payment was started
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [payment]
                        properties:
                          payment: {$ref: "#/components/schemas/Payment"}
        "409":
          description: |
            The order is not payable, or a payment has already been started for it
            through this gateway.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /webhooks/payments/{gateway}:
    post:
      operationId: paymentWebhook
      summary: A gateway's callback
      description: |
        Public, because a gateway cannot hold a session. What authenticates it is the
        signature over the raw body, carried in the header the named gateway uses.
        The signature is verified before anything is looked up.
      parameters:
        - name: gateway
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        "200":
          description: |
            The notification was met. `data.settled` says whether this delivery was the
            one that performed the settlement, and `data.already_settled` says it had
            been performed earlier — both are success, because the caller's obligation
            was to deliver.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [settled, already_settled]
                        properties:
                          settled: {type: boolean}
                          already_settled: {type: boolean}
        "400":
          description: The body could not be parsed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "401":
          description: The signature does not match
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
        "409":
          description: |
            The callback disagrees with the platform's record — a different amount or
            currency. Reported rather than absorbed, because the two sources believing
            they agree is the failure this endpoint exists to prevent.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /subscriptions:
    get:
      operationId: listSubscriptions
      summary: The signed-in customer's subscriptions
      responses:
        "200":
          description: Subscriptions, most recent first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [subscriptions]
                        properties:
                          subscriptions:
                            type: array
                            items: {$ref: "#/components/schemas/Subscription"}
        "401":
          description: No session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /subscriptions/{id}:
    get:
      operationId: getSubscription
      summary: One of the customer's subscriptions
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: The subscription
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [subscription]
                        properties:
                          subscription: {$ref: "#/components/schemas/Subscription"}
        "404": {description: No such subscription}
  /subscriptions/{id}/cancel:
    post:
      operationId: cancelSubscription
      summary: Ask for the subscription to end when the period does
      description: |
        The current period has been paid for and is not cut short. The machine
        honours the request when it would next bill, instead of billing again.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: The request is recorded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [cancel_at_period_end]
                        properties:
                          cancel_at_period_end: {type: boolean, enum: [true]}
        "404": {description: No such subscription}
        "409": {description: The subscription has already ended}
  /subscriptions/{id}/renew:
    post:
      operationId: renewSubscription
      summary: Pay the due renewal now, from the wallet balance
      description: |
        The sweep would reach it on its own pass. The renewal is paid from the
        wallet, the period is extended in the same transaction, and the response
        carries the subscription in its new period.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: The subscription in its new period
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [subscription]
                        properties:
                          subscription: {$ref: "#/components/schemas/Subscription"}
        "404": {description: No such subscription}
        "409":
          description: The period has not ended, the subscription has ended, or the
            balance does not cover the renewal
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  /admin/subscriptions/{id}/terminate:
    post:
      operationId: terminateSubscription
      summary: End a subscription on the platform's authority
      description: |
        The administrative hand on the machine. It answers abuse and chargebacks,
        not preference, and requires the `subscriptions.terminate` permission.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Terminated}
        "403": {description: The administrator does not hold the permission}
        "404": {description: No such subscription}
        "409": {description: The subscription has already ended}
  /admin/overview:
    get:
      operationId: adminOverview
      responses:
        "200": {description: Dashboard aggregates}
  /admin/users:
    get:
      operationId: adminListUsers
      responses:
        "200": {description: Users}
  /admin/users/{id}:
    get:
      operationId: adminGetUser
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": {description: User with wallets}
        "404": {description: Not found}
  /admin/users/{id}/suspend:
    post:
      operationId: adminSuspendUser
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": {description: Suspended}
  /admin/users/{id}/activate:
    post:
      operationId: adminActivateUser
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": {description: Activated}
  /admin/products:
    get:
      operationId: adminListProducts
      responses:
        "200": {description: Products with plans}
  /admin/orders:
    get:
      operationId: adminListOrders
      responses:
        "200": {description: Orders}
  /admin/orders/{id}:
    get:
      operationId: adminGetOrder
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": {description: Order with items and payments}
        "404": {description: Not found}
  /admin/payments:
    get:
      operationId: adminListPayments
      responses:
        "200": {description: Payments}
  /admin/ledger:
    get:
      operationId: adminLedger
      responses:
        "200": {description: Ledger movements and wallet balances}
  /admin/subscriptions:
    get:
      operationId: adminListSubscriptions
      responses:
        "200": {description: Subscriptions}
  /admin/instances:
    get:
      operationId: adminListInstances
      responses:
        "200": {description: Instances}
  /admin/instances/{id}:
    get:
      operationId: adminGetInstance
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": {description: Instance detail with joins}
        "404": {description: Not found}
  /admin/tickets:
    get:
      operationId: adminListTickets
      responses:
        "200": {description: Tickets}
  /admin/tickets/{id}:
    get:
      operationId: adminGetTicket
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": {description: Ticket with messages}
        "404": {description: Not found}
  /admin/tickets/{id}/messages:
    post:
      operationId: adminReplyTicket
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: {type: string}
      responses:
        "201": {description: Message appended}
        "404": {description: Not found}
  /admin/tickets/{id}/close:
    post:
      operationId: adminCloseTicket
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": {description: Ticket closed}
        "404": {description: Not found}
  /admin/audit:
    get:
      operationId: adminListAudit
      responses:
        "200": {description: Recent audit events}
  /admin/admins:
    get:
      operationId: adminListAdmins
      responses:
        "200": {description: Administrators with roles}
  /admin/roles:
    get:
      operationId: adminListRoles
      responses:
        "200": {description: Roles with permissions}
  /admin/settings:
    get:
      operationId: adminListSettings
      responses:
        "200": {description: System settings}
  /admin/operations:
    get:
      operationId: adminListOperations
      responses:
        "200": {description: Operations}
  /admin/operations/{id}:
    get:
      operationId: getOperation
      summary: One operation and its steps
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The operation's record
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationDetailResponse"}
        "403": {description: The administrator does not hold operations.read}
  /admin/operations/events:
    get:
      operationId: streamOperationEvents
      summary: An operation's Server-Sent-Events stream
      parameters:
        - name: operation_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: SSE
          content:
            text/event-stream:
              schema: {type: string}
        "403": {description: The administrator does not hold operations.read}
  /admin/providers:
    get:
      operationId: listProviders
      summary: The platform's provider records
      responses:
        "200":
          description: Providers, name order
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [providers]
                        properties:
                          providers:
                            type: array
                            items: {$ref: "#/components/schemas/AdminProvider"}
        "403": {description: The administrator does not hold providers.read}
  /admin/node-groups:
    get:
      operationId: listNodeGroups
      summary: The scheduling groups
      responses:
        "200":
          description: Node groups, name order
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [node_groups]
                        properties:
                          node_groups:
                            type: array
                            items: {$ref: "#/components/schemas/AdminNodeGroup"}
        "403": {description: The administrator does not hold nodes.read}
  /admin/nodes:
    get:
      operationId: listNodes
      summary: The nodes with their capacity book
      responses:
        "200":
          description: Nodes, name order
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [nodes]
                        properties:
                          nodes:
                            type: array
                            items: {$ref: "#/components/schemas/AdminNode"}
        "403": {description: The administrator does not hold nodes.read}
  /instances:
    get:
      operationId: listInstances
      responses:
        "200": {description: Instances}
  /instances/{id}:
    get:
      operationId: getInstance
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": {description: Instance}
        "404": {description: Not found}
  /instances/{id}/restart:
    post:
      operationId: restartInstance
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationAccepted"}
        "409": {description: Conflict}
  /instances/{id}/reinstall:
    post:
      operationId: reinstallInstance
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image_id]
              properties:
                image_id: {type: string}
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationAccepted"}
  /operations/{id}:
    get:
      operationId: getOperation
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Operation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationResponse"}
  /events:
    get:
      operationId: streamEvents
      responses:
        "200":
          description: SSE
          content:
            text/event-stream:
              schema: {type: string}
  /wallet:
    get:
      operationId: getWallet
      responses:
        "200": {description: Wallet balances and ledger movements}
  /invoices:
    get:
      operationId: listInvoices
      responses:
        "200": {description: Invoices}
  /invoices/{id}:
    get:
      operationId: getInvoice
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": {description: Invoice with items}
        "404": {description: Not found}
  /notifications:
    get:
      operationId: listNotifications
      responses:
        "200": {description: Notifications with unread count}
  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": {description: Marked read}
  /tickets:
    get:
      operationId: listTickets
      responses:
        "200": {description: Tickets}
    post:
      operationId: createTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, message]
              properties:
                subject: {type: string}
                priority: {type: string, enum: [low, normal, high]}
                message: {type: string}
      responses:
        "201": {description: Ticket opened}
  /tickets/{id}:
    get:
      operationId: getTicket
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": {description: Ticket with messages}
        "404": {description: Not found}
  /tickets/{id}/messages:
    post:
      operationId: addTicketMessage
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: {type: string}
      responses:
        "201": {description: Message appended}
        "404": {description: Not found}
  /tickets/{id}/close:
    post:
      operationId: closeTicket
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": {description: Ticket closed}
        "404": {description: Not found}
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: |
        The synchroniser token issued with the session (ADR-004). Required on every
        state-changing request and ignored on safe ones. A header rather than a form field
        or a second cookie: a cross-site form post cannot set a custom header without
        provoking a preflight, and a token read from a cookie would be accepted from a
        channel an attacker can also write to.
      schema: {type: string}
  schemas:
    SuccessEnvelope:
      type: object
      required: [success, data, request_id]
      properties:
        success: {type: boolean, const: true}
        data: {type: object}
        request_id: {type: string}
    ErrorEnvelope:
      type: object
      required: [success, error, request_id]
      properties:
        success: {type: boolean, const: false}
        request_id: {type: string}
        error:
          type: object
          required: [code, message_key]
          properties:
            code:
              type: string
              description: A stable machine-readable identifier.
              enum:
                - INTERNAL_ERROR
                - VALIDATION_FAILED
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - METHOD_NOT_ALLOWED
                - CONFLICT
                - RATE_LIMITED
                - REQUEST_TIMEOUT
                - SERVICE_UNAVAILABLE
            message_key:
              type: string
              description: |
                An i18n key, never a sentence. The client localises it, so no
                user-visible text is baked into a response. Field-level validation
                failures use `errors.invalid_<field>`.
            details:
              type: object
              description: Non-localisable structured context, such as the field that failed.
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 12}
        locale:
          type: string
          enum: [zh-CN, en-US]
          description: Defaults to zh-CN when omitted.
        timezone: {type: string}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string}
        password: {type: string}
    User:
      type: object
      required: [id, email, status, locale, timezone]
      properties:
        id: {type: string, format: uuid}
        email: {type: string}
        status: {type: string, enum: [active, suspended]}
        locale: {type: string, enum: [zh-CN, en-US]}
        timezone: {type: string}
    Admin:
      type: object
      required: [id, email, status, permissions]
      properties:
        id: {type: string, format: uuid}
        email: {type: string}
        display_name: {type: string}
        status: {type: string, enum: [active, suspended]}
        permissions:
          type: array
          items: {type: string}
          description: |
            The effective set, resolved for this request. The client uses it to decide
            what to offer; enforcement stays on the backend (docs/14).
    UserSession:
      type: object
      required: [user, csrf_token, expires_at]
      properties:
        user: {$ref: "#/components/schemas/User"}
        csrf_token: {type: string}
        expires_at: {type: string, format: date-time}
    AdminSession:
      type: object
      required: [admin, csrf_token, expires_at]
      properties:
        admin: {$ref: "#/components/schemas/Admin"}
        csrf_token: {type: string}
        expires_at: {type: string, format: date-time}
    Product:
      type: object
      required: [id, slug, name, plans]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        name:
          type: object
          description: Localised names, keyed by the locales docs/13 defines.
          additionalProperties: {type: string}
        plans:
          type: array
          items: {$ref: "#/components/schemas/Plan"}
    Plan:
      type: object
      required: [id, slug, name, cpu_cores, memory_mb, disk_gb, virtualization, billing_cycle, price_minor, currency]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        name:
          type: object
          additionalProperties: {type: string}
        cpu_cores:
          type: string
          description: A decimal literal, because a float cannot represent 0.1 exactly.
        memory_mb: {type: integer}
        disk_gb: {type: integer}
        virtualization: {type: string}
        billing_cycle: {type: string, enum: [monthly, quarterly, semiannually, annually]}
        price_minor: {type: integer, minimum: 0}
        currency: {type: string}
    OrderItem:
      type: object
      required: [plan_id, slug, name, quantity, unit_price_minor, total_minor, currency]
      properties:
        plan_id: {type: string, format: uuid}
        slug: {type: string}
        name:
          type: object
          additionalProperties: {type: string}
        quantity: {type: integer}
        unit_price_minor: {type: integer, minimum: 0}
        total_minor: {type: integer, minimum: 0}
        currency: {type: string}
    Order:
      type: object
      required: [id, order_no, status, subtotal_minor, discount_minor, total_minor, currency, items, created_at]
      properties:
        id: {type: string, format: uuid}
        order_no: {type: string}
        status: {type: string, enum: [pending, paid, fulfilling, fulfilled, cancelled, refund_pending, refunded]}
        subtotal_minor: {type: integer, minimum: 0}
        discount_minor: {type: integer, minimum: 0}
        total_minor: {type: integer, minimum: 0}
        currency: {type: string}
        items:
          type: array
          items: {$ref: "#/components/schemas/OrderItem"}
        paid_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
    Payment:
      type: object
      required: [payment_no, order_id, gateway, status, amount_minor, currency, gateway_payment_id, pay_url]
      properties:
        payment_no: {type: string}
        order_id: {type: string, format: uuid}
        gateway: {type: string}
        status: {type: string, enum: [pending, processing, succeeded, failed, partially_refunded, refunded]}
        amount_minor: {type: integer, minimum: 0}
        currency: {type: string}
        gateway_payment_id: {type: string}
        pay_url: {type: string}
        expires_at: {type: [string, "null"], format: date-time}
    Subscription:
      type: object
      required: [id, plan_id, status, billing_cycle, price_minor, currency,
                 current_period_start, current_period_end, next_due_at,
                 cancel_at_period_end, version]
      properties:
        id: {type: string, format: uuid}
        plan_id: {type: string, format: uuid}
        status:
          type: string
          enum: [pending, active, past_due, suspended, cancelled, expired, terminated]
        billing_cycle: {type: string, enum: [monthly, quarterly, semiannually, annually]}
        price_minor: {type: integer, format: int64, description: The period price in minor units}
        currency: {type: string}
        started_at: {type: string, format: date-time, nullable: true}
        current_period_start: {type: string, format: date-time}
        current_period_end: {type: string, format: date-time}
        next_due_at: {type: string, format: date-time}
        grace_until: {type: string, format: date-time, nullable: true,
                      description: The deadline by which the current state must resolve}
        cancel_at_period_end: {type: boolean}
        ended_at: {type: string, format: date-time, nullable: true}
        version: {type: integer, format: int64}
    OperationDetailResponse:
      type: object
      required: [success, data, request_id]
      properties:
        success: {type: boolean, const: true}
        request_id: {type: string}
        data: {$ref: "#/components/schemas/OperationDetail"}
    OperationDetail:
      type: object
      required: [operation, steps]
      properties:
        operation: {$ref: "#/components/schemas/AdminOperation"}
        steps:
          type: array
          items: {$ref: "#/components/schemas/AdminOperationStep"}
    AdminOperation:
      type: object
      required: [id, type, resource_type, resource_id, status, progress,
                 retry_count, max_retries, trace_id, created_at]
      properties:
        id: {type: string, format: uuid}
        type: {type: string}
        resource_type: {type: string}
        resource_id: {type: string, format: uuid}
        status:
          type: string
          enum: [queued, running, waiting_provider, waiting_resource,
                 verifying, retrying, succeeded, failed, cancelled]
        phase: {type: string, nullable: true}
        progress: {type: integer, minimum: 0, maximum: 100}
        message_key: {type: string, nullable: true}
        provider_operation_id: {type: string, nullable: true}
        retry_count: {type: integer}
        max_retries: {type: integer}
        error_code: {type: string, nullable: true}
        error_message: {type: string, nullable: true}
        trace_id: {type: string}
        started_at: {type: string, format: date-time, nullable: true}
        finished_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}
    AdminOperationStep:
      type: object
      required: [key, order, status, progress, attempt]
      properties:
        key: {type: string}
        order: {type: integer}
        status: {type: string, enum: [pending, running, succeeded, failed, skipped]}
        progress: {type: integer, minimum: 0, maximum: 100}
        attempt: {type: integer}
        error_code: {type: string, nullable: true}
        error_message: {type: string, nullable: true}
        started_at: {type: string, format: date-time, nullable: true}
        finished_at: {type: string, format: date-time, nullable: true}
    AdminProvider:
      type: object
      required: [id, name, type, status]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        type: {type: string, enum: [direct, agent]}
        status: {type: string, enum: [active, disabled]}
    AdminNodeGroup:
      type: object
      required: [id, name, region, status]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        region: {type: string}
        status: {type: string, enum: [active, disabled]}
    AdminNode:
      type: object
      required: [id, provider_id, name, region, status, cpu_total, memory_total_mb,
                 disk_total_gb, weight, version]
      properties:
        id: {type: string, format: uuid}
        provider_id: {type: string, format: uuid}
        group_id: {type: string, format: uuid, nullable: true}
        name: {type: string}
        region: {type: string}
        status: {type: string, enum: [online, degraded, draining, maintenance, offline]}
        cpu_total: {type: number}
        cpu_allocated: {type: number}
        cpu_reserved: {type: number}
        memory_total_mb: {type: integer, format: int64}
        memory_allocated_mb: {type: integer, format: int64}
        memory_reserved_mb: {type: integer, format: int64}
        disk_total_gb: {type: integer, format: int64}
        disk_allocated_gb: {type: integer, format: int64}
        disk_reserved_gb: {type: integer, format: int64}
        weight: {type: integer}
        version: {type: integer, format: int64}
    OperationAccepted:
      type: object
      required: [success, data, request_id]
      properties:
        success: {type: boolean, const: true}
        request_id: {type: string}
        data:
          type: object
          required: [operation_id, status]
          properties:
            operation_id: {type: string, format: uuid}
            status: {type: string, enum: [queued]}
    OperationResponse:
      type: object
      required: [success, data, request_id]
      properties:
        success: {type: boolean, const: true}
        request_id: {type: string}
        data:
          type: object
          required: [id, status, progress]
          properties:
            id: {type: string, format: uuid}
            status:
              type: string
              enum: [queued, running, waiting_provider, waiting_resource, verifying, retrying, succeeded, failed, cancelled]
            phase: {type: [string, "null"]}
            progress: {type: integer, minimum: 0, maximum: 100}
            message_key: {type: [string, "null"]}
            retryable: {type: boolean}
            error_code: {type: [string, "null"]}
