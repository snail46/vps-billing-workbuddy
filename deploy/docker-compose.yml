# Foundation environment for Phase 0.
#
# This file is what the Gate in TASKS.md starts:
#
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d --build
#
# Every value has a default, so the command above works without an .env file.
# The defaults are development values; a real deployment must supply its own
# secrets and its own URLs.
#
# See docs/adr/ADR-003-foundation-topology-and-gate.md for why the reverse proxy
# listed in docs/17-DEPLOYMENT.md is deferred to Phase 12, and why `migrate` is a
# separate one-shot service rather than something the server does on boot.

name: vps-billing

# Shared build inputs for the three binaries produced by backend/Dockerfile.
#
# `migrate`, `server` and `worker` below all run this one image and select their
# binary with `command`. The image therefore declares CMD rather than ENTRYPOINT:
# compose *overrides* CMD with `command` but *appends* `command` to ENTRYPOINT, so
# an ENTRYPOINT here would make every service run the server and make `migrate`
# never exit — which blocks all its dependants.
x-backend-build: &backend-build
  context: ../backend
  dockerfile: Dockerfile
  args:
    VERSION: ${APP_VERSION:-dev}
    COMMIT: ${APP_COMMIT:-unknown}
    BUILD_TIME: ${APP_BUILD_TIME:-unknown}

# Shared runtime configuration. Only settings the processes actually read are
# listed; see backend/internal/config/config.go for the authoritative set.
x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-development}
  # Kept in step with the postgres service below. Overriding POSTGRES_USER or
  # POSTGRES_DB therefore requires overriding DATABASE_URL as well; the CI Gate
  # and .env.example both set them together.
  DATABASE_URL: ${DATABASE_URL:-postgres://vps_billing:change-me@postgres:5432/vps_billing?sslmode=disable}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  USER_WEB_ORIGIN: ${USER_WEB_ORIGIN:-http://localhost:3000}
  ADMIN_WEB_ORIGIN: ${ADMIN_WEB_ORIGIN:-http://localhost:3001}
  HTTP_ADDR: ":8080"

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vps_billing}
      POSTGRES_USER: ${POSTGRES_USER:-vps_billing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # $$ escapes the compose interpolation so the shell inside the container
      # expands the variables, not the compose file parser.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # Applies the versioned migrations and exits. It is a separate service so that
  # schema change is an explicit, observable step rather than a side effect of
  # the API process starting (docs/17 requires versioned migrations only).
  migrate:
    image: vps-billing-backend:local
    build: *backend-build
    command: ["/app/migrate", "up"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    image: vps-billing-backend:local
    build: *backend-build
    command: ["/app/server"]
    environment: *backend-environment
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        # The API must not serve traffic against an unmigrated schema.
        condition: service_completed_successfully
    healthcheck:
      # busybox wget is present in the alpine runtime image, so no extra tooling
      # is added to the image for the sake of a probe.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  worker:
    image: vps-billing-backend:local
    build: *backend-build
    command: ["/app/worker"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  user-web:
    build:
      context: ../frontend
      dockerfile: user-web/Dockerfile
      args:
        VITE_API_BASE_URL: ${USER_WEB_API_BASE_URL:-http://localhost:8080}
    environment:
      # Must match USER_WEB_ORIGIN above, since the API allowlists this origin.
      API_ORIGIN: ${USER_WEB_ORIGIN:-http://localhost:3000}
    ports:
      - "${USER_WEB_PORT:-3000}:80"
    # Start order only. The static files do not depend on the API being healthy,
    # and a hard dependency here would obscure a server failure with a web
    # container failure.
    depends_on:
      - server
    restart: unless-stopped

  admin-web:
    build:
      context: ../frontend
      dockerfile: admin-web/Dockerfile
      args:
        VITE_API_BASE_URL: ${ADMIN_WEB_API_BASE_URL:-http://localhost:8080}
    environment:
      API_ORIGIN: ${ADMIN_WEB_ORIGIN:-http://localhost:3001}
    ports:
      - "${ADMIN_WEB_PORT:-3001}:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
