# sqlc configuration.
#
# The schema is the migrations themselves, listed explicitly rather than pointing
# at the directory. sqlc reads every .sql file under a `schema` entry, and the down
# migrations drop the tables the up migrations create, so pointing at the
# directory would hand sqlc a schema in which nothing exists. scripts/check-
# migrations.py asserts that every up migration is listed here, so a phase that
# adds one cannot leave generated code silently behind the database.
#
# `db/schema.sql` at the repository root is deliberately not used: it describes the
# finished V1 schema, so generating from it would produce code that references
# tables later phases have not created yet.
version: "2"

sql:
  - engine: "postgresql"
    schema:
      - "migrations/0001_init.up.sql"
      - "migrations/0002_identity.up.sql"
      - "migrations/0003_identity_rbac_seed.up.sql"
      - "migrations/0004_commerce.up.sql"
    queries: "internal/db/queries"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/db/sqlcgen"
        # pgx/v5 matches ADR-001. The default database/sql output would introduce a
        # second database idiom alongside the one the pools already use.
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        # Identifiers are generated by the application as UUIDv7 (docs/04) and are
        # google/uuid values everywhere else in the codebase, so the generated code
        # uses the same type rather than a pgtype.UUID that every caller has to
        # convert.
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              type: "UUID"
              import: "github.com/google/uuid"
              pointer: true
